# docker-compose.yml
#version: '3.8'

services:
  db:
    image: mariadb:12.0
    container_name: flibusta-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-flibusta}
      - MYSQL_USER=${DB_USER:-flibusta}
      - MYSQL_PASSWORD=${DB_PASSWORD:-flibusta}
      - TZ=Europe/Moscow
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.8'
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d:ro
      - ./config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3

  tor:
    image: alpine/tor:latest
    container_name: flibusta-tor
    restart: unless-stopped
    ports:
      - "9050:9050"
    volumes:
      - ./config/torrc:/etc/tor/torrc:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

  bot:
    image: holyshithappens/flbst-bot-mdb:dev
    container_name: flibusta-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DB_HOST=db
      - FLIBUSTA_TOR_PROXY=socks5://tor:9050
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.7'
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    user: "1000:1000"

volumes:
  mariadb_data: